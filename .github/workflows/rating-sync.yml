name: Rating Sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rating-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
      SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
      SIMKL_ACCESS_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN }}
      DRY_RUN: ${{ vars.DRY_RUN }}
      BATCH_SIZE: "50"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Sync ratings
        run: python bridge.py
